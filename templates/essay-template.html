  __PRISM_CSS__
  <link rel="stylesheet" href="/style.css" />

  <script>
    (function () {
      const storedTheme = localStorage.getItem('theme');
      if (storedTheme) {
        document.documentElement.setAttribute('data-theme', storedTheme);
      } else {
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
      }
    })();
  </script>
</head>
<body>

  <header class="container">
    <nav>
      <ul><li><strong><a href="/" class="contrast">ZFRQBL</a></strong></li></ul>
      <ul>
        <li>
          <button id="theme-toggle" class="outline secondary theme-toggle-btn" aria-label="Toggle theme">🌙 / ☀️</button>
        </li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <article class="essay-content">
      <header class="note-header">
        <div class="meta-line">
          <small class="secondary note-kicker">__KIND_LABEL__</small>

  <footer class="container site-footer">
    <small class="secondary">
      © <script>document.write(new Date().getFullYear())</script> ZFRQBL — Built with HTML & Pico CSS.
    </small>
  </footer>

  <script>
    document.getElementById('theme-toggle')?.addEventListener('click', () => {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
    });
  </script>
