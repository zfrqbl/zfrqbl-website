<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>__TITLE__ — ZFRQBL</title>
  <meta name="description" content="__DESCRIPTION__" />
  <link rel="canonical" href="__CANONICAL_URL__" />
  <meta name="author" content="Zafar" />
  <link rel="alternate" type="application/rss+xml" title="ZFRQBL" href="https://zfrqbl.com/rss.xml" />

  <!-- Open Graph -->
  <meta property="og:type" content="article" />
  <meta property="og:title" content="__TITLE__" />
  <meta property="og:description" content="__DESCRIPTION__" />
  <meta property="og:url" content="__CANONICAL_URL__" />
  <meta property="og:image" content="__OG_IMAGE__" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />

  <!-- PWA / Mobile Feel -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0172ad" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#111827" media="(prefers-color-scheme: dark)" />
  <link rel="apple-touch-icon" href="/favicon.svg" />

  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/vendor/pico.2.1.1.min.css" />
  <link rel="stylesheet" href="/vendor/prism-tomorrow.min.css" />
  <link rel="stylesheet" href="/style.css" />

  <script>
    (function () {
      const storedTheme = localStorage.getItem('theme');
      if (storedTheme) {
        document.documentElement.setAttribute('data-theme', storedTheme);
      } else {
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
      }
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>

  <header class="container">
    <nav>
      <ul><li><strong><a href="/" class="contrast">ZFRQBL</a></strong></li></ul>
      <ul>
        <li><a href="/about">About</a></li>
        <li><button id="theme-toggle" class="outline secondary theme-toggle-btn" aria-label="Toggle theme">🌙 / ☀️</button></li>
      </ul>
    </nav>
  </header>

  <main id="main-content" class="container">
    <article class="note-content">
      <header class="note-header">
        <div class="meta-line">
          <small class="secondary note-kicker">Note __NOTE_NUMBER__</small>
          <span class="secondary">•</span>
          <time datetime="__DATE_ISO__" class="secondary meta-time">__DATE_DISPLAY__</time>
          <span class="secondary">•</span>
          __READING_TIME__
        </div>
        <h1>__TITLE__</h1>
      </header>

      <section>__CONTENT__</section>

      __SOURCES__
      __RELATED__

      <div class="cite-block">
        <strong>Cite this note</strong>
        <pre id="citation-text"></pre>
        <button class="copy-btn" id="copy-citation" style="position:static;">Copy citation</button>
      </div>

      <p class="secondary discuss-link">
        <a href="https://github.com/zfrqbl/zfrqbl-website/discussions" rel="noopener">Discuss this note on GitHub</a>
      </p>

      __NOTE_NAV__
    </article>
  </main>

  <footer class="container site-footer">
    <small class="secondary">© <script>document.write(new Date().getFullYear())</script> ZFRQBL</small>
  </footer>

  <script>
    document.getElementById('theme-toggle')?.addEventListener('click', () => {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
    });

    // Code copy buttons
    document.querySelectorAll('.copy-btn').forEach(button => {
      if (button.id === 'copy-citation') return;
      button.addEventListener('click', () => {
        const container = button.closest('.code-container');
        if (!container) return;
        const code = container.querySelector('code').innerText;
        navigator.clipboard.writeText(code).then(() => {
          button.innerText = 'Copied!';
          setTimeout(() => button.innerText = 'Copy', 2000);
        });
      });
    });

    // Inject code language labels
    document.querySelectorAll('pre[class*="language-"]').forEach(pre => {
      const cls = [...pre.classList].find(c => c.startsWith('language-'));
      if (cls) {
        const lang = cls.replace('language-', '').replace('prism-', '');
        const container = pre.closest('.code-container') || pre.parentElement;
        if (container && !container.querySelector('.code-lang')) {
          const span = document.createElement('span');
          span.className = 'code-lang';
          span.textContent = lang;
          container.prepend(span);
        }
      }
    });

    // Heading anchors (Click to copy link)
    document.querySelectorAll('main h2[id], main h3[id], main h4[id]').forEach(heading => {
      const anchor = document.createElement('a');
      anchor.href = `#${heading.id}`;
      anchor.className = 'heading-anchor';
      anchor.setAttribute('aria-label', 'Permalink');
      anchor.addEventListener('click', (e) => {
        e.preventDefault();
        navigator.clipboard.writeText(window.location.href.split('#')[0] + `#${heading.id}`);
        anchor.classList.add('copied');
        setTimeout(() => anchor.classList.remove('copied'), 2000);
        history.replaceState(null, '', `#${heading.id}`);
      });
      heading.prepend(anchor);
    });

    // Keyboard shortcuts (T for theme toggle)
    document.addEventListener('keydown', (e) => {
      if (['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) return;
      if (e.key === 't' || e.key === 'T') {
        document.getElementById('theme-toggle')?.click();
      }
    });

    // Citation generator
    (function () {
      const citeEl = document.getElementById('citation-text');
      const copyBtn = document.getElementById('copy-citation');
      if (!citeEl) return;

      const title = document.querySelector('meta[property="og:title"]')?.content || document.title.replace(/\s*[—|]\s*ZFRQBL.*$/, '');
      const url = document.querySelector('link[rel="canonical"]')?.href || location.href;
      const author = document.querySelector('meta[name="author"]')?.content || 'Zafar';
      const timeEl = document.querySelector('time[datetime]');
      const year = timeEl ? new Date(timeEl.getAttribute('datetime')).getFullYear() : new Date().getFullYear();
      const slug = (location.pathname.replace(/\/$/, '').split('/').pop() || 'note').replace(/[^a-z0-9]+/gi, '_');

      citeEl.textContent = `@misc{zfrqbl_${slug}_${year},\n  author = {${author}},\n  title  = {${title}},\n  year   = {${year}},\n  url    = {${url}}\n}`;

      copyBtn?.addEventListener('click', () => {
        navigator.clipboard.writeText(citeEl.textContent).then(() => {
          copyBtn.textContent = 'Copied!';
          setTimeout(() => copyBtn.textContent = 'Copy citation', 2000);
        });
      });
    })();
  </script>

  <script src="/vendor/prism.min.js"></script>
  <script src="/vendor/prism-python.min.js"></script>
  <script src="/vendor/prism-javascript.min.js"></script>
  <script src="/vendor/prism-bash.min.js"></script>
  <script src="/vendor/prism-sql.min.js"></script>
  <script src="/vendor/prism-markdown.min.js"></script>
</body>
</html>
